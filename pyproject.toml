[project]
name = "echoes-across-dynasties"
version = "0.1.0"
description = "Reproducible Classical Chinese poetry corpus preparation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
echoes = "echoes.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/echoes"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
